name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]

    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive ../../

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate

      - name: plan
        run: |
          terraform plan -refresh=false -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_ENV: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.PLAN_ENV;
            let plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');

            // github comments have a size limit
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (truncated)';
            }

            const body = [
              `### Terraform plan: ${env}`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
