services:
  db:
    image: postgres:16-alpine
    container_name: hotel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./db/migrations/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/003_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
